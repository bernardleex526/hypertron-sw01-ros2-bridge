# 直连驱动有效参数（仅含 hypertron_driver 节点使用的键）。
# 10.18.0.100:3600 由厂商库硬编码，不在本文件配置。
hypertron_driver:
  ros__parameters:
    interface: "eno1"
    host_address: "10.18.0.200/24"
    robot_address: "10.18.0.100"

    topics:
      cmd_vel: "/cmd_vel"
      robot_mode: "/robot_mode"
      joint_commands: "/joint_commands"
      imu: "/imu/data"
      odom: "/odom"
      robot_state: "/robot_state"
      points: "/points"
      odom_lidar: "/odom_lidar"

    frames:
      imu: "imu_link"
      odom: "odom"
      base: "base_link"

    subscriptions:
      imu_frequency_hz: 50
      sport_frequency_hz: 50
      lidar_enabled: true

    lidar:
      point_cloud_port: 6100
      odometry_port: 6101
      bind_ip: "0.0.0.0"
      # 期望的 UDP 源地址（点云/里程计包来自机器人）；换网段须同步修改。
      source_ip: "10.18.0.100"
      point_position_scale: 0.001
      odom_position_scale: 0.000001
      odom_quaternion_scale: 1.0
      frame_id: "lidar"
      frame_timeout_ms: 300
      max_parallel_frames: 4
      max_points_per_frame: 2000000
      # 注意：每包最多 50 点，4096 包只能组 204800 点；若实机单帧超过该
      # 值，必须调大 max_packets_per_frame（节点启动时会对此告警）。
      max_packets_per_frame: 4096

    odom_lidar:
      parent_frame: "odom"
      child_frame: "lidar"
      pose_covariance_diagonal: [0.05, 0.05, 0.05, 0.01, 0.01, 0.01]

    sdk:
      init_timeout_ms: 60000
      call_timeout_ms: 5000
      heartbeat_call_timeout_ms: 500
      heartbeat_max_failures: 1

    timing:
      heartbeat_period_ms: 100
      motion_refresh_period_ms: 20
      state_poll_period_ms: 500
      mode_timeout_ms: 5000
      reconnect_initial_delay_ms: 1000
      reconnect_max_delay_ms: 30000

    safety:
      command_deadman_ms: 100
      queue_capacity: 16

    imu:
      quaternion_order: "xyzw"
      orientation_covariance_diagonal: [0.02, 0.02, 0.05]
      angular_velocity_covariance_diagonal: [0.01, 0.01, 0.02]
      linear_acceleration_covariance_diagonal: [0.10, 0.10, 0.20]

    odom:
      publish_tf: false

    odometry:
      scale_verified: false
