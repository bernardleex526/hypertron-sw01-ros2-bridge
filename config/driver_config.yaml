# 直连驱动有效参数（仅含 hypertron_driver 节点使用的键）。
# 10.18.0.100:3600 由厂商库硬编码，不在本文件配置。
hypertron_driver:
  ros__parameters:
    interface: "eno1"
    host_address: "10.18.0.200/24"
    robot_address: "10.18.0.100"

    topics:
      cmd_vel: "/cmd_vel"
      robot_mode: "/robot_mode"
      joint_commands: "/joint_commands"
      imu: "/imu/data"
      odom: "/odom"
      robot_state: "/robot_state"
      points: "/points"
      odom_lidar: "/odom_lidar"

    frames:
      imu: "imu_link"
      odom: "odom"
      base: "base_link"

    subscriptions:
      imu_frequency_hz: 50
      sport_frequency_hz: 50
      lidar_enabled: true
      # LiDAR 订阅频率：1 Hz 是保守默认；若实机点云/里程计频率不足或
      # 与 frame_timeout_ms 冲突，可按实机抓包结果调高（25/50/125/250）。
      lidar_frequency_hz: 1

    lidar:
      point_cloud_port: 6100
      odometry_port: 6101
      bind_ip: "0.0.0.0"
      # 期望的 UDP 源地址（点云/里程计包来自机器人）；换网段须同步修改。
      source_ip: "10.18.0.100"
      point_position_scale: 0.0000191
      odom_position_scale: 0.0000009474
      odom_quaternion_scale: 1.0
      # 6101 四元数分量顺序：xyzw（默认）或 wxyz（实机抓包后回填）。
      odom_quaternion_order: "xyzw"
      # UDP 6100 raw point axes are not the body-aligned axes used by the
      # UDP 6101 odometry frame. mapping.launch.py publishes the calibrated
      # lidar -> lidar_points rotation.
      frame_id: "lidar_points"
      frame_timeout_ms: 300
      max_parallel_frames: 4
      max_points_per_frame: 2000000
      # 每包最多 50 点；默认 40000 包可组满 2,000,000 点。
      # 若实机单帧点数/包数不同，按抓包结果调整。
      max_packets_per_frame: 40000

    odom_lidar:
      parent_frame: "odom"
      child_frame: "lidar"
      # 将 /odom_lidar 作为 odom->lidar TF 发布；需 odometry.scale_verified=true
      # 且 mapping.launch 提供 lidar->base_link 与 lidar->lidar_points 静态 TF
      # 后才可进入 SLAM/Nav2。
      publish_tf: false
      pose_covariance_diagonal: [0.05, 0.05, 0.05, 0.01, 0.01, 0.01]

    sdk:
      init_timeout_ms: 60000
      call_timeout_ms: 5000
      heartbeat_call_timeout_ms: 500
      heartbeat_max_failures: 1

    timing:
      heartbeat_period_ms: 100
      motion_refresh_period_ms: 20
      state_poll_period_ms: 500
      mode_timeout_ms: 5000
      reconnect_initial_delay_ms: 1000
      reconnect_max_delay_ms: 30000

    safety:
      command_deadman_ms: 100
      queue_capacity: 16

    imu:
      quaternion_order: "xyzw"
      orientation_covariance_diagonal: [0.02, 0.02, 0.05]
      angular_velocity_covariance_diagonal: [0.01, 0.01, 0.02]
      linear_acceleration_covariance_diagonal: [0.10, 0.10, 0.20]

    odom:
      publish_tf: false

    odometry:
      scale_verified: true
