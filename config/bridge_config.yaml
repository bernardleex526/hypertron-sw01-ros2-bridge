hypertron_bridge:
  ros__parameters:
    ssh:
      host: "192.168.1.100"
      port: 22
      username: "robot"
      password: ""
      private_key: "~/.ssh/id_ed25519"
      known_hosts: "~/.ssh/known_hosts"
      strict_host_key_checking: true
      remote_command: "/opt/hypertron/bin/hypertron_bridge_agent --stdio --config /opt/hypertron/config/bridge_config.yaml"
      connect_timeout_ms: 5000
      keepalive_interval_ms: 1000
      ping_interval_ms: 200
      application_timeout_ms: 500
      # Must exceed astrall.initialization_timeout_ms.
      agent_startup_timeout_ms: 65000
      reconnect_initial_delay_ms: 1000
      reconnect_max_delay_ms: 30000

    astrall:
      sdk_timeout_ms: 20
      initialization_timeout_ms: 60000
      heartbeat_hz: 10.0
      motion_refresh_hz: 50.0
      state_poll_hz: 2.0
      imu_frequency: 125
      sport_frequency: 50
      auto_acquire_control: true
      auto_prepare_motion: false

    topics:
      cmd_vel: "/cmd_vel"
      joint_commands: "/joint_commands"
      robot_mode: "/robot_mode"
      emergency_stop: "/emergency_stop"
      imu: "/imu/data"
      joint_states: "/joint_states"
      odom: "/odom"
      robot_state: "/robot_state"
      camera: "/camera/image_raw"

    frames:
      imu: "imu_link"
      odom: "odom"
      base: "base_link"
      camera: "camera_link"

    safety:
      command_deadman_ms: 100
      mode_timeout_ms: 10000
      queue_capacity: 64
      telemetry_queue_capacity: 256
      max_payload_bytes: 8388608

    odometry:
      enabled: true
      bind_address: "0.0.0.0"
      point_cloud_port: 6100
      odometry_port: 6101
      packing: "auto"
      position_scale: 1.0e-6
      quaternion_scale: 1.0
      point_position_scale: 1.0e-3
      scale_verified: false
      timestamp_source: "receive"

    imu:
      quaternion_order: "xyzw"
      timestamp_source: "receive"
      orientation_covariance_diagonal: [0.02, 0.02, 0.05]
      angular_velocity_covariance_diagonal: [0.01, 0.01, 0.02]
      linear_acceleration_covariance_diagonal: [0.10, 0.10, 0.20]

    camera:
      enabled: false
      bind_address: "0.0.0.0"
      port: 6000
      output_encoding: "bgr8"
      queue_capacity: 2
